name: vendor-service
description: CI/CD pipeline for vendor service

on:
  push:
    branches:
      - dev
  # Uncomment the following lines to enable pull request testing
  # pull_request:
  #   branches: [main]
jobs:
  buildAndTest:
    name: CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["12.x"]

    steps:
      # Checkout the repo
      - uses: actions/checkout@v3

      # Set up Node.js ||
      # Initialize Node.js
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install root dependencies (for monorepo)
      - name: Install dependencies
        run: npm install
