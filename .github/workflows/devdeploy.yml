# This code defines a selection of logic or functionality.
# Please provide the code selection so that documentation comments can be generated.

name: vendor-service
on:
  push:
    branches: [main, dev]
  # Uncomment the following lines to enable pull request testing
  pull_request:
    branches: [main, dev]

  # Pseudocode:
  # When a push is made to the 'dev' branch, run the CI pipeline.
  # Before running build and test, display who made the update, the time, and the commit message.
jobs:
  buildAndTest:
    name: CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["12.x"]

    steps:
      # Checkout the repo
      - uses: actions/checkout@v3

      # Show commit details (author, time, message)
      - name: Show commit info
        run: |
          echo "Commit Author: $(git log -1 --pretty=format:'%an <%ae>')"
          echo "Commit Date: $(git log -1 --date=iso --pretty=format:'%ad')"
          echo "Commit Message: $(git log -1 --pretty=format:'%s')"
        shell: bash
        # This step prints out who made the last commit, when, and the commit message

      # Set up Node.js ||
      # Initialize Node.js
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install root dependencies (for monorepo)
      - name: Install dependencies
        run: npm install
        # working-directory: ./Vendors

      # Run tests
      - name: Run tests
        run: npm test
        # This step runs your test suite. Make sure you have tests defined in package.json.

      # Lint code
      - name: Lint code
        run: npm run lint || echo "Linting failed, but continuing..."
        # This step checks code quality. Adjust the command if you use a different linter.

      # Build project (if applicable)
      - name: Build project
        run: npm run build || echo "Build failed, but continuing..."
        # This step builds your project. Remove '|| echo ...' if you want to fail on build errors.
